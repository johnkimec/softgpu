<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="softgpu">
  <!-- paper tile so it reads on light and dark tabs -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#f4f3ef"/>
  <!-- sleepy die -->
  <g fill="none" stroke="#1c1c1c" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 15.5
             C6 9.5 11.5 7.2 16 7
             C20.5 6.8 26 9 26.5 15
             C27 20.5 22.5 24.2 16.5 24.5
             C10.5 24.8 5.2 21.2 5.5 15.5 Z"/>
    <!-- closed eyes -->
    <path d="M10.2 14.2 Q11.6 13.2 13.2 14.2"/>
    <path d="M18.8 14.2 Q20.2 13.2 21.8 14.2"/>
    <!-- smile / blanket fold -->
    <path d="M11.2 18.6 Q16 21.2 20.8 18.6"/>
    <!-- nightcap -->
    <path d="M10.5 12.2 Q13.2 9.4 16.2 11.8"/>
    <path d="M16.2 11.8 Q17.1 11.2 17.8 10.2"/>
  </g>
  <circle cx="17.9" cy="10" r="1.05" fill="#1c1c1c"/>
  <!-- doorbell -->
  <circle cx="16" cy="16.6" r="1.55" fill="#a33d2a"/>
  <!-- tiny Z -->
  <path d="M23.2 8.2 h3.1 l-3 2.6 h3.1" fill="none" stroke="#1c1c1c" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
